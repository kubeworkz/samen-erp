version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-samenerp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional, for rate limiting)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Samenerp Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-4050}:4050"
    environment:
      # Database
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:-postgres}@db/${POSTGRES_DB:-samenerp}
      
      # Phoenix
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-generate_with_mix_phx_gen_secret}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: true
      
      # KMS (use FileBacked for dev, AWS KMS for prod)
      SAMEN_KMS_ADAPTER: ${SAMEN_KMS_ADAPTER:-file_backed}
      SAMEN_KMS_FILE_PATH: ${SAMEN_KMS_FILE_PATH:-/app/data/kms_store.json}
      
      # HuggingFace AI Integration
      SAMEN_HF_FINCH_POOL: ${SAMEN_HF_FINCH_POOL:-Samenerp.HFHTTPClient}
      
      # Stripe (optional)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      
      # ESP (optional)
      SAMEN_ESP_PROVIDER: ${SAMEN_ESP_PROVIDER:-}
      SAMEN_POSTMARK_API_KEY: ${SAMEN_POSTMARK_API_KEY:-}
      SAMEN_SES_REGION: ${SAMEN_SES_REGION:-}
      SAMEN_RESEND_API_KEY: ${SAMEN_RESEND_API_KEY:-}
      
      # Observability (optional)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      
      # Node name for clustering
      RELEASE_NODE: ${RELEASE_NODE:-samenerp@127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  redis_data:
  app_data:
