name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: runner

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0"
          install-hex: true
          rebar3-version: latest

      - name: Prepare PostgreSQL role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'CREATE ROLE runner LOGIN SUPERUSER CREATEDB; CREATE ROLE clank LOGIN SUPERUSER CREATEDB;'

      - name: Run fast CI tier
        run: bash ./ci-fast.sh

  # The deploy build, on EVERY pull request AND every push to main. `fast`/`full`
  # compile in MIX_ENV=test only, so neither can see a :prod-only compile break —
  # which is how main stayed green while every deploy failed `docker build` for
  # four days (2026-09-25 → 09-28). Runs in parallel with them (a PR pays no extra
  # wall-clock) and is deliberately NOT part of ci.sh/ci-fast.sh: it is the one
  # stage that has to `mix deps.get --only prod` and compile from scratch (~10 min
  # cold), which would roughly double the local root gate for a verdict CI already
  # gives. Run it locally with `bash scripts/prod_compile_gate.sh`. No Postgres
  # service: it compiles, it never connects.
  prod:
    name: Prod Compile Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0"
          install-hex: true
          rebar3-version: latest

      - name: Build every app in MIX_ENV=prod + assemble the samenerp release
        run: bash ./scripts/prod_compile_gate.sh

  full:
    name: Full CI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0"
          install-hex: true
          rebar3-version: latest

      - name: Prepare PostgreSQL role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'CREATE ROLE runner LOGIN SUPERUSER CREATEDB; CREATE ROLE clank LOGIN SUPERUSER CREATEDB;'

      - name: Run full CI gate
        run: bash ./ci.sh

      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-diagnostics
          path: |
            /tmp/samen_ci_gates.*
            /tmp/*.log
          if-no-files-found: ignore
